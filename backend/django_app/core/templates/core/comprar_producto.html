{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Comprar - {{ producto.nombre_producto }}</title>
    <link href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
    <style>
        body{ padding-top:80px; font-family: 'Montserrat', sans-serif; background: #ffffff; }
        .container{ max-width:900px; margin:40px auto; }
        .product-card{ background:#fff; padding:24px; border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,0.06); }
        .product-image{ max-width:160px; max-height:160px; width:100%; height:auto; object-fit:contain; border-radius:8px; background:#fff; padding:6px; box-shadow:0 4px 14px rgba(0,0,0,0.06); }
        .btn-primary{ background:#9932CC; border:none; }
        .note{ color:#666; font-size:14px; }
    </style>
</head>
<body>
    <div class="container">
        {% include 'core/_purchase_form.html' with producto=producto single_button=False %}
    </div>
</body>
</html>

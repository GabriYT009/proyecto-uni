{# Mensajes flotantes en la parte superior #}
<style>
  .alert-container {
    position: fixed !important;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    width: auto;
    max-width: min(460px, calc(100vw - 24px));
    min-width: 0 !important;
    margin: 0;
    z-index: 2000;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: stretch;
    pointer-events: none;
  }

  .alert-container .alert {
    border-radius: 16px;
    padding: 0;
    margin-bottom: 0;
    font-size: 0.93rem;
    line-height: 1.3;
    border: none;
    overflow: hidden;
  }

  .alert-container .message-toast {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    padding: 13px 14px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    background: rgba(42, 18, 64, 0.94);
    color: #ffffff;
    box-shadow: 0 16px 30px rgba(17, 5, 28, 0.26);
    backdrop-filter: blur(16px) saturate(115%);
    -webkit-backdrop-filter: blur(16px) saturate(115%);
    animation: toastDropIn 220ms ease-out;
    pointer-events: auto;
  }

  .alert-container .message-toast.is-hiding {
    opacity: 0;
    transform: translateY(-10px) scale(0.97);
    transition: opacity 220ms ease, transform 220ms ease;
  }

  .alert-container .alert-success {
    background: linear-gradient(135deg, rgba(56, 193, 144, 0.96), rgba(28, 139, 102, 0.96));
    color: #f8fffb;
  }

  .alert-container .alert-error,
  .alert-container .alert-danger {
    background: linear-gradient(135deg, rgba(239, 87, 123, 0.96), rgba(176, 41, 78, 0.96));
    color: #fff7fa;
  }

  .alert-container .alert-warning {
    background: linear-gradient(135deg, rgba(245, 171, 53, 0.96), rgba(190, 117, 16, 0.96));
    color: #fffdf8;
  }

  .alert-container .alert-info {
    background: linear-gradient(135deg, rgba(98, 132, 255, 0.96), rgba(68, 92, 196, 0.96));
    color: #f7f9ff;
  }

  .alert-container .btn-close {
    flex: 0 0 auto;
    margin-top: -1px;
    border: 0;
    background: transparent;
    color: inherit;
    font-size: 1rem;
    font-weight: 800;
    line-height: 1;
    cursor: pointer;
    opacity: 0.9;
    padding: 0;
  }

  .alert-container .message-text {
    flex: 1 1 auto;
  }

  @keyframes toastDropIn {
    from { opacity: 0; transform: translateY(-10px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  @media (max-width: 480px) {
    .alert-container {
      top: 12px;
      max-width: calc(100vw - 16px);
    }

    .alert-container .message-toast {
      padding: 12px;
    }
  }
</style>
{% if messages %}
  <div class="alert-container" data-message-container>
    {% for message in messages %}
      <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show shadow message-toast" role="alert" data-message-toast>
        <span class="message-text">{{ message }}</span>
        <button type="button" class="btn-close" aria-label="Cerrar" data-message-close>&times;</button>
      </div>
    {% endfor %}
  </div>
  <script>
    (function () {
      function dismissToast(toast) {
        if (!toast || toast.dataset.dismissing === '1') return;
        toast.dataset.dismissing = '1';
        toast.classList.add('is-hiding');
        window.setTimeout(function () {
          if (toast && toast.parentNode) {
            toast.parentNode.removeChild(toast);
          }
        }, 260);
      }

      function bindToasts() {
        document.querySelectorAll('[data-message-toast]').forEach(function (toast) {
          if (toast.dataset.bound === '1') return;
          toast.dataset.bound = '1';

          var closeButton = toast.querySelector('[data-message-close]');
          if (closeButton) {
            closeButton.addEventListener('click', function () {
              dismissToast(toast);
            });
          }

          window.setTimeout(function () {
            dismissToast(toast);
          }, 3000);
        });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bindToasts);
      } else {
        bindToasts();
      }
    })();
  </script>
{% endif %}

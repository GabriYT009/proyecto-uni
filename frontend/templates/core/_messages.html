{# Fragmento para mostrar mensajes de Django con Bootstrap #}
{% if messages %}
  <div class="alert-container" style="position: fixed; top: 80px; right: 20px; z-index: 1050; min-width: 300px;">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show shadow" role="alert" style="margin-bottom: 12px;">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    {% endfor %}
  </div>
{% endif %}

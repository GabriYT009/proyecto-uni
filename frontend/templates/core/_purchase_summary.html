{% load static %}
<div class="product-card">
    <h3 style="color:#9932CC; margin-top:0;">Resumen de compra</h3>
    <form method="POST" action="{% url 'comprar_carrito' %}" id="formComprarCarrito">
        {% csrf_token %}
        <div style="display:flex; flex-direction:column; gap:12px;">
            {% for p in Productos %}
                <div style="display:flex; gap:12px; align-items:center; padding:8px 0; border-bottom:1px solid rgba(0,0,0,0.04);">
                    {% if p.img_url %}
                        <img src="{{ p.img_url }}" alt="{{ p.nombre_producto }}" style="width:80px; height:80px; object-fit:contain; border-radius:6px; background:#fff; padding:6px;" />
                    {% endif %}
                    <div style="flex:1">
                        <strong>{{ p.nombre_producto }}</strong>
                        <div style="color:#666">{{ p.descripcion }}</div>
                    </div>
                    <div style="text-align:right; min-width:140px;">
                        <div style="font-weight:700">$ {{ p.precio_venta }}</div>
                        <div style="margin-top:6px; display:flex; gap:8px; align-items:center; justify-content:flex-end;">
                            <button type="button" class="btn-qty" data-action="dec" data-id="{{ p.pk }}">-</button>
                            <input type="number" name="cantidad_{{ p.pk }}" id="cantidad_{{ p.pk }}" value="1" min="1" max="{{ p.cantidad_disponible|default:'0' }}" style="width:64px; text-align:center;" />
                            <button type="button" class="btn-qty" data-action="inc" data-id="{{ p.pk }}">+</button>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
        <div style="display:flex; gap:12px; justify-content:flex-end; margin-top:12px;">
            <button type="submit" class="btn btn-primary">Comprar ahora</button>
        </div>
    </form>
    <script>
        (function(){
            document.querySelectorAll('.btn-qty').forEach(function(b){
                b.addEventListener('click', function(){
                    var id = this.dataset.id;
                    var action = this.dataset.action;
                    var inp = document.getElementById('cantidad_' + id);
                    if (!inp) return;
                    var v = parseInt(inp.value,10) || 0;
                    var max = parseInt(inp.max,10) || 0;
                    if (action === 'inc' && (max === 0 || v < max)) inp.value = v + 1;
                    if (action === 'dec' && v > 1) inp.value = v - 1;
                });
            });
        })();
    </script>
</div>

<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
    <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}?v=2">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="login-page">
    {% if user.is_authenticated %}
        <a href="{% url 'home' %}" class="bar-logo-link" aria-label="Inicio">
            <img id="logo" src="{% static 'core/logo nuevo.png' %}" alt="Solucionarte">
        </a>
    {% else %}
        <a href="{% url 'home' %}" class="bar-logo-link" aria-label="Inicio">
            <img id="logo" src="{% static 'core/logo nuevo.png' %}" alt="Solucionarte">
        </a>
    {% endif %}
    <div class="container auth-card login-card">
        <h2>Inicio de sesiÃ³n</h2>
        {% include 'core/_messages.html' %}
        {% if error %}
            <div class="auth-error">{{ error }}</div>
        {% endif %}
        <form id="loginForm" method="post" action="{% url 'login_post' %}">
            {% csrf_token %}
            <div class="full">
                <label for="username">Nombre de usuario</label>
                <input id="username" name="username" type="text" required>
            </div>
            <div class="full">
                <label for="password">ContraseÃ±a</label>
                <input id="password" name="password" type="password" required>
            </div>
            <div class="hint">Â¿OlvidÃ³ su contraseÃ±a? <a href="{% url 'recuperar_contrasena' %}">RecupÃ©rala aquÃ­</a></div>
            <button type="submit">Iniciar sesiÃ³n</button>
                <div class="registrarse">
                    Â¿No tienes una cuenta? <a href="{% url 'crear_usuario' %}">Registrar</a>
                </div>
        </form>
    </div>

    <script src="{% static 'core/main.js' %}"></script>
    <script>
        // Clear form inputs on load and when page is shown from bfcache
        (function(){
            function clearFormFields(){
                document.querySelectorAll('form input, form textarea, form select').forEach(function(el){
                    if (el.tagName.toLowerCase() === 'select'){
                        el.selectedIndex = 0;
                    } else if (el.type !== 'hidden' && el.type !== 'submit' && el.type !== 'button'){
                        el.value = '';
                    }
                });
            }
            window.addEventListener('DOMContentLoaded', clearFormFields);
            window.addEventListener('pageshow', function(e){ if (e.persisted) clearFormFields(); });
        })();
    </script>
    <script src="{% static 'core/page-loader.js' %}"></script>
</body>
</html>

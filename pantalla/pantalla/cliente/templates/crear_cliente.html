{% extends 'base.html' %}

{% block title %}Registro de Cliente{% endblock %}

{% block content %}
    <div class="container">
        <h2>Registro de Cliente (Solucionarte)</h2>
        <form action="/procesar_cliente" method="POST">
            
            <label for="tipo">1. Tipo de Cliente:</label>
            <select name="id_tipo_cliente" id="tipo" required>
                <option value="">-- Seleccione el tipo --</option>
                <option value="1">Persona Natural</option>
                <option value="2">Persona Jurídica (Empresa)</option>
            </select>
            
            <hr>
            <h3>Datos Generales (Tabla CLIENTE)</h3>
            
            <input type="text" name="nombre_cliente" placeholder="Nombre de Contacto" required>
            <input type="text" name="apellido_cliente" placeholder="Apellido (o C.A.)">
            <input type="text" name="direccion" placeholder="Dirección">
            <input type="text" name="telefono_cliente" placeholder="Teléfono">
            <input type="email" name="email" placeholder="Email">
            
            <hr>
            
            <div id="identificacion_natural" class="fieldset" style="display:none;">
                <h4>Identificación (Natural)</h4>
                <input type="text" name="cedula_dni" placeholder="Cédula/DNI" >
            </div>
            
            <div id="identificacion_juridica" class="fieldset" style="display:none;">
                <h4>Identificación (Jurídica)</h4>
                <input type="text" name="rif_empresa" placeholder="RIF de la Empresa" >
                <input type="text" name="nombre_empresa" placeholder="Nombre de la Empresa" >
                <input type="text" name="cedula_dni_representante" placeholder="Cédula del Representante" >
            </div>

            <button type="submit">Guardar Cliente en Solucionarte</button>
        </form>
    </div>
    
    <script>
    document.getElementById('tipo').addEventListener('change', function() {
        const tipo = this.value;
        const natural = document.getElementById('identificacion_natural');
        const juridica = document.getElementById('identificacion_juridica');

        natural.style.display = 'none';
        juridica.style.display = 'none';

        if (tipo === '1') {
            natural.style.display = 'block';
        } else if (tipo === '2') {
            juridica.style.display = 'block';
        }
    });
    </script>
{% endblock %}

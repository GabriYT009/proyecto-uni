services:
  - type: web
    name: proyecto-uni
    env: python
    runtime: python-3.11
    plan: free
    envVars:
      - key: PYTHONPATH
        value: /opt/render/project/src/pantalla/pantalla/pantalla
    buildCommand: python -m pip install --upgrade pip setuptools wheel && python -m pip install --no-cache-dir whitenoise==6.12.0 && python -m pip install --no-cache-dir -r requirements.txt && python django_app/manage.py migrate --noinput && python django_app/manage.py collectstatic --noinput
    startCommand: python start.py
